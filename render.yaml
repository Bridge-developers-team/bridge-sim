# Render Blueprint: one free web service built from the Dockerfile.
# Production is the `preprod` branch: Render deploys it only after every
# GitHub check passes (CI must be green). The live service (bridge-prod) was
# created by hand with these same settings; this file documents them and can
# recreate the service as a Blueprint.
services:
  - type: web
    name: bridge-prod
    runtime: docker
    plan: free
    region: frankfurt
    branch: preprod
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # paste in the Render dashboard; never in git
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: SECRET_KEY
        generateValue: true
      - key: ADZUNA_APP_ID
        sync: false # optional: live job listings (free key at developer.adzuna.com)
      - key: ADZUNA_APP_KEY
        sync: false
      - key: AI_CALLS_PER_DAY
        value: "150"
