[project]
name = "bridge"
version = "0.2.0"
description = "Bridge: AI career-transition navigator (API + static front end)"

requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8,<3",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "psycopg[binary]>=3.2",
    "aiosqlite>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.13",
    "ty>=0.0.1a20",
    "import-linter>=2.1",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
src = ["src", "tests"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is how pytest tests
    "RUF001", # curly quotes are deliberate in the quote normalizer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fixed fake secrets in tests

[tool.ty.environment]
python-version = "3.12"

# Dependency direction (CLAUDE.md "Layers"): a lower layer never imports a
# higher one. Breaking it fails CI.
[tool.importlinter]
root_package = "bridge"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api -> services -> llm | db -> domain"
type = "layers"
layers = [
    "bridge.main",
    "bridge.api",
    "bridge.services",
    "bridge.llm | bridge.db",
    "bridge.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: no web, database or AI imports"
type = "forbidden"
source_modules = ["bridge.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "anthropic", "bridge.config"]
